# upall runs topgrade's steps in parallel lanes instead of one after another (copy to ~/.config/upall/tools-lanes.conf).
# One lane per line:  NAME: step, step, cmd:custom command
#   step         a topgrade step name (`topgrade --help` lists them): pipx, uv, rustup, claude_code, codex...
#   cmd:NAME     a custom command from topgrade.toml [commands]
# Everything not listed runs in a last lane called "rest", so nothing is skipped. Steps that share one package
# manager or one directory (two npm installs, two pipx runs) belong in the SAME lane; they would fight over it.
# Delete this file (or every line) to run topgrade one step after another, as before.
# upall checks the lanes with `topgrade -n` first: if they don't cover topgrade's plan exactly once (typo, a step
# in two lanes, a step your topgrade.toml disables) it warns and falls back to the sequential run.
#
# Times from a real run: npm globals 54s | VS Code extensions 14s, Codex 14s, Claude plugins 8s | the rest ~40s.
npm:     cmd:npm globals
editors: cmd:Visual Studio Code extensions, claude_code, claude_code_plugins, codex
