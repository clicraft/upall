# upall-secwatch settings. Copy to ~/.config/upall/secwatch.conf (optional: without it the defaults apply).
#
# AUTO_APPLY=1 (default): when security updates appear, run `upall --security` unattended: those packages only
#   (plus what they need), no other upgrades, no Flatpak/Snap/tools. upall's safety rules still apply: with
#   nobody to answer, a plan that removes packages, a kernel /boot may not hold, a failed Timeshift snapshot or a
#   plan that changed meanwhile means apt is skipped and you get a "needs you" notification instead.
# AUTO_APPLY=0: only notify (desktop + phone); "Update now" in the notification opens `upall --tui`.
#
# Never reboots, whatever this is set to.
AUTO_APPLY=1
