# Phone pushes for upall-secwatch, through ntfy (https://ntfy.sh).
# Copy to ~/.config/upall/ntfy.conf and make it private: chmod 600 ~/.config/upall/ntfy.conf
# Without this file there are no pushes, only desktop notifications.

# The topic name is a secret: on the public ntfy.sh anyone who knows it can read and post. Make it long and
# random, then subscribe to the same topic in the ntfy app on your phone:
#   echo "NTFY_URL=https://ntfy.sh/$(hostname -s)-$(head -c 15 /dev/urandom | base32 | tr -d = | tr A-Z a-z)"
# https only (plain http is accepted just for a server on localhost).
NTFY_URL=https://ntfy.sh/CHANGE-ME-to-a-long-random-topic

# Optional: an ntfy access token (tk_…), for a reserved topic on ntfy.sh or a self-hosted server with access
# control. Then the topic name alone is no longer enough to read your alerts.
#NTFY_TOKEN=tk_...

# Pushes carry counts only ("2 security updates pending"). 1 adds the package names and a link to Ubuntu's
# CVE page: handier, but whoever learns the topic then sees which vulnerable packages this machine has.
#NTFY_DETAILS=0
