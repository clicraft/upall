name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04          # same ShellCheck (0.9.0) as Ubuntu 24.04 desktops
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck version
        run: shellcheck --version
      - name: Lint shell scripts
        # bin/upall has no .sh extension, so list the scripts by their shebang
        run: |
          mapfile -t scripts < <(git ls-files | xargs grep -lE '^#!.*\b(ba)?sh\b' --)
          printf 'checking: %s\n' "${scripts[@]}"
          shellcheck --format=gcc "${scripts[@]}"

  python:
    name: python syntax
    runs-on: ubuntu-24.04          # system Python 3.12, as on Ubuntu 24.04 desktops
    steps:
      - uses: actions/checkout@v5
      - name: Compile every Python file
        run: |
          python3 --version
          mapfile -t files < <(git ls-files '*.py')
          printf 'checking: %s\n' "${files[@]}"
          python3 -m py_compile "${files[@]}"

  sudoers:
    name: visudo
    runs-on: ubuntu-24.04          # sudo 1.9.15: regex arguments (^…$) need 1.9.10 or later
    steps:
      - uses: actions/checkout@v5
      - name: Check the sudoers template
        # the same substitution install.sh makes, then sudo's own parser
        run: |
          sudo --version | head -1
          sed "s/@USER@/$(id -un)/g" sudoers/upall-nopasswd > "$RUNNER_TEMP/upall-nopasswd"
          sudo visudo -c -f "$RUNNER_TEMP/upall-nopasswd"
